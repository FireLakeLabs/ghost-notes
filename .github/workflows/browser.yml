name: Browser

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    name: browser (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [ui, audio]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- ci-${{ matrix.group }}
        env:
          ODM_PROFILE_PATH: test-results/browser-timings.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser-timings.json
          if-no-files-found: warn
